    buildCommand: npm install
    startCommand: node src/server.js
    rootDir: server
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: mongodb+srv://midohoss2003_db_user:8fqaqzxUMBGqObgH@cluster0.5jbaykp.mongodb.net/?retryWrites=true&w=majority
